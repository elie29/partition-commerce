spring:
  output.ansi.enabled: always
  application:
    name: commerce

  datasource:
    url: jdbc:h2:file:./.local/h2/commerce;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

commerce:
  fraud-review:
    # AR-3: the customers (an invoice's customerId, matched exactly) who can neither pay nor be refunded. The risk team
    # edits this list until it has a system; it is read at start-up, so an edit counts at the next restart. A missing
    # list, or an entry blank or longer than 255 characters, stops the start.
    customers: []

management:
  endpoints:
    web:
      discovery:
        enabled: true
      exposure:
        include: 'health,info,metrics'
  endpoint:
    health:
      show-details: always
