# yaml-language-server: $schema=../.claude/skills/partition-budget/assets/partition.schema.json
# Partition - project configuration.
# Strict YAML subset: block maps and lists, one value per line, flow lists [a, b] of plain values.
# Put quotes around a value that holds ": " or starts with * & !

version: 1
target: claude                # whose loading rules the gauges follow: claude | copilot
bridge: none                  # none | superpowers (the plugin writes the plans' body; paths.plans keeps the folder)

paths:
  specs: docs/specs
  invariants: docs/specs/invariants.md
  designs: docs/designs
  plans: docs/plans
  contracts: docs/contracts
  sources: docs/sources        # PRDs and described contexts, decomposed by partition-shape
  # schemas: docs/schema      # declare it only if the project documents its persistence

budget:
  always: 32000               # the owner's limit: no bounded context may load more tokens than this before reading code
  chars_per_token: 4
  review: quarterly           # when the assessment is held, e.g. quarterly, every six sprints

contexts:                     # one entry per bounded context, declared by partition-shape or partition-reshape
  - id: invoice
    area: billing
    code:
      - src/main/java/com/commerce/invoice/**
    hexagons:
      - id: invoice
        form: rich
        reason: an invoice moves from issued to paid or cancelled under BR-3, BR-4, BR-18 and BR-23, and some transitions are forbidden
        layers:
          domain: src/main/java/com/commerce/invoice/domain/**
          application: src/main/java/com/commerce/invoice/application/**
          inbound: src/main/java/com/commerce/invoice/inbound/**
          outbound: src/main/java/com/commerce/invoice/outbound/**
        allowed:
          - application -> domain
          - inbound -> application
          - outbound -> application
          - outbound -> domain
  - id: payment
    area: billing
    code:
      - src/main/java/com/commerce/payment/**
    hexagons:
      - id: payment
        form: rich
        reason: a payment moves from made to cancelled within 24 hours (workshop, architect, 2026-10-19)
        layers:
          domain: src/main/java/com/commerce/payment/domain/**
          application: src/main/java/com/commerce/payment/application/**
          inbound: src/main/java/com/commerce/payment/inbound/**
          outbound: src/main/java/com/commerce/payment/outbound/**
        allowed:
          - application -> domain
          - inbound -> application
          - outbound -> application
          - outbound -> domain
  - id: refund
    area: billing
    code:
      - src/main/java/com/commerce/refund/**
    hexagons:
      - id: refund
        form: rich
        reason: a refund is bounded by what was paid, and it moves from requested to sent to settled (architect, 2026-10-19)
        layers:
          domain: src/main/java/com/commerce/refund/domain/**
          application: src/main/java/com/commerce/refund/application/**
          inbound: src/main/java/com/commerce/refund/inbound/**
          outbound: src/main/java/com/commerce/refund/outbound/**
        allowed:
          - application -> domain
          - inbound -> application
          - outbound -> application
          - outbound -> domain
  - id: product
    area: catalog
    code:
      - src/main/java/com/commerce/product/**
    hexagons:
      - id: product
        form: thin
        reason: "its only rule checks an input: there is no state to protect; the unique reference (BR-1) is held by a unique constraint in the store (architect, 2026-10-19)"
        layers:
          application: src/main/java/com/commerce/product/application/**
          inbound: src/main/java/com/commerce/product/inbound/**
          outbound: src/main/java/com/commerce/product/outbound/**
        allowed:
          - inbound -> application
          - outbound -> application
  - id: price-list
    area: catalog
    code:
      - src/main/java/com/commerce/pricelist/**
    hexagons:
      - id: price-list
        form: rich
        reason: one price per product holds at every write (BR-1) (architect, 2026-10-19)
        layers:
          domain: src/main/java/com/commerce/pricelist/domain/**
          application: src/main/java/com/commerce/pricelist/application/**
          inbound: src/main/java/com/commerce/pricelist/inbound/**
          outbound: src/main/java/com/commerce/pricelist/outbound/**
        allowed:
          - application -> domain
          - inbound -> application
          - outbound -> application
          - outbound -> domain
  - id: discount
    area: catalog
    code:
      - src/main/java/com/commerce/discount/**
    hexagons:
      - id: discount
        form: thin
        reason: "its rules only check inputs (BR-1, BR-3, BR-4, BR-9): a discount is created and read, never changed, and what it keeps governs nothing (BR-2, BR-5, BR-6) (Claire Martin, architect, 2026-10-20)"
        layers:
          application: src/main/java/com/commerce/discount/application/**
          inbound: src/main/java/com/commerce/discount/inbound/**
          outbound: src/main/java/com/commerce/discount/outbound/**
        allowed:
          - inbound -> application
          - outbound -> application
