# yaml-language-server: $schema=../.claude/skills/partition-budget/assets/partition.schema.json
# Partition - project configuration.
# Strict YAML subset: block maps and lists, one value per line, flow lists [a, b] of plain values.
# Put quotes around a value that holds ": " or starts with * & !

version: 1
target: claude                # whose loading rules the gauges follow: claude | copilot
bridge: none                  # none | superpowers (the plugin writes the plans' body; paths.plans keeps the folder)

paths:
  specs: docs/specs
  invariants: docs/specs/invariants.md
  designs: docs/designs
  plans: docs/plans
  contracts: docs/contracts
  sources: docs/sources        # PRDs and described contexts, decomposed by partition-shape
  # schemas: docs/schema      # declare it only if the project documents its persistence

budget:
  always: 32000               # the owner's limit: no bounded context may load more tokens than this before reading code
  chars_per_token: 4
  review: quarterly           # when the assessment is held, e.g. quarterly, every six sprints

contexts:                     # one entry per bounded context, declared by partition-shape or partition-reshape
  - id: invoice
    area: billing
    code:
      - commerce-app/src/main/java/com/commerce/invoice/**
    hexagons:
      - id: invoice
        form: rich
        reason: an invoice moves from issued to paid or cancelled under BR-3, BR-4, BR-18 and BR-23, and some transitions are forbidden
        layers:
          domain: commerce-app/src/main/java/com/commerce/invoice/domain/**
          application: commerce-app/src/main/java/com/commerce/invoice/application/**
          inbound: commerce-app/src/main/java/com/commerce/invoice/inbound/**
          outbound: commerce-app/src/main/java/com/commerce/invoice/outbound/**
        allowed:
          - application -> domain
          - inbound -> application
          - outbound -> application
          - outbound -> domain
  - id: payment
    area: billing
    code:
      - payment-app/src/main/java/com/commerce/payment/**
    hexagons:
      - id: payment
        form: rich
        reason: "a payment moves from made to cancelled within 24 hours (workshop, architect, 2026-10-19); a refund is bounded by what was paid, and it moves from requested to sent to settled (architect, 2026-10-19); absorbed refund (architect, 2026-10-20)"
        layers:
          domain: payment-app/src/main/java/com/commerce/payment/domain/**
          application: payment-app/src/main/java/com/commerce/payment/application/**
          inbound: payment-app/src/main/java/com/commerce/payment/inbound/**
          outbound: payment-app/src/main/java/com/commerce/payment/outbound/**
        allowed:
          - application -> domain
          - inbound -> application
          - outbound -> application
          - outbound -> domain
  - id: product
    area: catalog
    code:
      - commerce-app/src/main/java/com/commerce/product/**
    hexagons:
      - id: product
        form: rich
        reason: "a product can be retired and is never reactivated (BR-9); the unique reference (BR-1) stays held by the store's unique constraint (Claire Martin, architect, 2026-10-20); one price per product and list holds at every write (BR-10) (architect, 2026-10-19); absorbed `price-list` (Claire Martin, architect, 2026-10-20)"
        layers:
          domain: commerce-app/src/main/java/com/commerce/product/domain/**
          application: commerce-app/src/main/java/com/commerce/product/application/**
          inbound: commerce-app/src/main/java/com/commerce/product/inbound/**
          outbound: commerce-app/src/main/java/com/commerce/product/outbound/**
        allowed:
          - application -> domain
          - inbound -> application
          - outbound -> application
          - outbound -> domain
  - id: customer
    area: customer
  - id: fraud
    area: customer
    code:
      - commerce-app/src/main/java/com/commerce/fraud/**
    hexagons:
      - id: fraud
        form: rich
        reason: "a review moves from open to lifted, and only the risk team lifts it (architect, 2026-10-20); one open review per customer holds at every write (BR-6) (architect, 2026-10-20)"
        layers:
          domain: commerce-app/src/main/java/com/commerce/fraud/domain/**
          application: commerce-app/src/main/java/com/commerce/fraud/application/**
          inbound: commerce-app/src/main/java/com/commerce/fraud/inbound/**
          outbound: commerce-app/src/main/java/com/commerce/fraud/outbound/**
        allowed:
          - application -> domain
          - inbound -> application
          - outbound -> application
          - outbound -> domain
