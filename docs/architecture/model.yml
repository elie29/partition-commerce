# C4 model of commerce. The source of the architecture views: change it here, then regenerate.
# Strict YAML subset: one value per line, quotes around a value holding ": " or starting with * & !
# Written once from the hand-drawn docs/architecture/commerce.drawio (2026-10-19); kinds and parents from the architect.

title: Commerce

elements:
  - id: customer
    kind: person
    name: Customer
  - id: accountant
    kind: person
    name: Accountant
  - id: commerce
    kind: system
    name: Commerce
    description: Sells products from price lists and bills them
  - id: commerce-app
    kind: container
    in: commerce
    name: Commerce app
    technology: Spring Boot 4.1, jar
  - id: invoicing
    kind: component
    in: commerce-app
    name: Invoicing
    context: invoice
  - id: payment
    kind: component
    in: commerce-app
    name: Payment
    context: payment
  - id: product
    kind: component
    in: commerce-app
    name: Product
    context: product
  - id: h2
    kind: container
    in: commerce
    name: H2
    description: The database
  - id: cardpay
    kind: system
    external: true
    name: CardPay

relations:
  - customer -> commerce-app: pays
  - accountant -> commerce-app: issues, cancels, refunds
  - invoicing -> h2: SQL
  - payment -> invoicing: InvoicePayments, in process
  - payment -> h2: SQL
  - payment -> cardpay: charges, reverses, sends refunds
  - product -> h2: SQL

views:
  - id: context
    kind: context
    of: commerce
    title: C4 1 - Context
  - id: containers
    kind: containers
    of: commerce
    title: C4 2 - Containers
  - id: components
    kind: components
    of: commerce-app
    title: C4 3 - Components of Commerce app
  - id: issue-invoice
    kind: dynamic
    title: Dynamic - Issue an invoice
    participants: [accountant, invoicing, h2]
    steps:
      - "accountant -> invoicing: POST /invoices (orderId, customerId, lines)"
      - "invoicing --> accountant: content refused (contract, BR-7 to BR-12): 400, no body"
      - "invoicing -> h2: insert the invoice and its lines, one transaction"
      - "h2 --> invoicing: order has an invoice not cancelled: unique key refused"
      - "invoicing --> accountant: BR-1: 409, no body"
      - "h2 --> invoicing: inserted"
      - "invoicing --> accountant: 201, the issued invoice"
  - id: cancel-invoice
    kind: dynamic
    title: Dynamic - Cancel an invoice
    participants: [accountant, invoicing, h2]
    steps:
      - "accountant -> invoicing: POST /invoices/{invoiceId}/cancel"
      - "invoicing -> h2: read the invoice"
      - "invoicing --> accountant: not a UUID, or no such invoice (BR-19): 404, no body"
      - "invoicing --> accountant: paid (BR-4) or already cancelled (BR-18): 409, no body"
      - "invoicing -> h2: set the status to cancelled, if still issued"
      - "h2 --> invoicing: no row changed: a simultaneous pay or cancel came first"
      - "invoicing --> accountant: BR-4, BR-18: 409, no body"
      - "h2 --> invoicing: changed"
      - "invoicing --> accountant: 200, the cancelled invoice"
  - id: pay-invoice
    kind: dynamic
    title: Dynamic - Pay an invoice by card
    participants: [customer, payment, invoicing, h2, cardpay]
    steps:
      - "customer -> payment: POST /invoices/{invoiceId}/pay (cardToken)"
      - "payment --> customer: content refused (contract, BR-22): 400, no body"
      - "payment -> invoicing: InvoicePayments.find"
      - "invoicing --> payment: the invoice, or none"
      - "payment --> customer: not a UUID, or no such invoice (BR-21): 404, no body"
      - "payment -> invoicing: InvoicePayments.customerOf"
      - "payment --> customer: customer under fraud review (AR-3): 403, no body; CardPay not called"
      - "payment --> customer: paid or cancelled (BR-20): 409, no body"
      - "payment -> cardpay: charge the card token for the whole amount"
      - "cardpay --> payment: declined"
      - "payment --> customer: 402, no body; still issued"
      - "cardpay --> payment: accepted, charge reference"
      - "payment -> invoicing: InvoicePayments.recordPayment, in payment's transaction"
      - "invoicing -> h2: set paid, if still issued (BR-23)"
      - "invoicing --> payment: no longer issued: a pay or a cancel came first"
      - "payment --> customer: BR-5: 409, no body; the charge is not kept"
      - "payment -> h2: insert the payment: amount, charge reference, time (BR-24); commit"
      - "payment --> customer: 200, the paid invoice"
  - id: refund-invoice
    kind: dynamic
    title: Dynamic - Refund a paid invoice
    participants: [accountant, payment, invoicing, h2, cardpay]
    steps:
      - "accountant -> payment: POST /invoices/{invoiceId}/refunds (amount)"
      - "payment --> accountant: content refused (contract, BR-26): 400, no body"
      - "payment -> invoicing: InvoicePayments.find"
      - "invoicing --> payment: the invoice, or none"
      - "payment --> accountant: not a UUID, or no such invoice (BR-27): 404, no body"
      - "payment -> invoicing: InvoicePayments.customerOf"
      - "payment --> accountant: customer under fraud review (AR-3): 403, no body"
      - "payment -> h2: read the payment of the invoice, when it is paid"
      - "payment --> accountant: not paid (BR-25, BR-29): 409, no body"
      - "payment --> accountant: another currency than the amount paid's (BR-25): 400, no body"
      - "payment -> h2: open the cap of the invoice at its amount paid, if not open"
      - "payment -> h2: add to the running total if it stays within the amount paid; insert the refund REQUESTED; commit"
      - "h2 --> payment: no row changed: it exceeds what remains"
      - "payment --> accountant: BR-25: 409, no body"
      - "payment -> cardpay: send the refund: charge reference, amount (BR-28)"
      - "payment -> h2: set the refund SENT"
      - "payment --> accountant: SENT not recorded: 500; the refund stays REQUESTED and counts"
      - "payment --> accountant: 201, the refund, SENT"
